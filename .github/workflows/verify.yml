name: Verify

# Ordinary commits / PRs run build, typecheck and Go unit tests; the release path
# (publish.yml) stays dependency-free with no extra failure points.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # packages/plugin engines requires >=22.5
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'   # packages/skill/src/go.mod requires go 1.22

      - run: pnpm install --frozen-lockfile

      - name: build + typecheck
        run: pnpm --filter dsh-task-ledger run verify

      # The ledger CLI is Go: vet + unit tests for core / store / shell.
      - name: ledger CLI vet + unit tests
        run: |
          cd packages/skill/src
          go vet ./...
          go test ./...
