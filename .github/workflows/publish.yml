name: Publish to npm

# 触发：按 tag 前缀分别发布两个包（单仓 pnpm workspaces 双包）。
#   skill-v*  → packages/skill（task-ledger，零代码、无构建步骤）
#   plugin-v* → packages/plugin（dsh-task-ledger，占位期无构建；有代码后补 install + build）
# 信任发布（OIDC）下无需 NPM_TOKEN；provenance 自动生成。
# ⚠️ npm 发的版本以各包 package.json 的 version 为准，不打 tag 本身——打 tag 前先改版本号，两者必须一致。
# ⚠️ 每个包的 npm 侧 Trusted Publisher 均已按「GitHub Actions + 本仓 + publish.yml + Allow npm publish」配置。
on:
  push:
    tags:
      - 'skill-v*'
      - 'plugin-v*'

permissions:
  id-token: write   # 必需：供 npm 通过 OIDC 做信任发布
  contents: read

jobs:
  skill:
    if: startsWith(github.ref, 'refs/tags/skill-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'

      - run: node --version && npm --version

      # npm 信任发布已勾选「Allow npm publish」：npm 11+ 自动走 OIDC，无需 NPM_TOKEN。
      - run: npm publish --provenance
        working-directory: packages/skill

  plugin:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'

      - run: node --version && npm --version

      # dist 已入仓（DSH 生态规则：git 直装、装完即用）⇒ CI 直接发布仓库内产物，不重构建。
      # 若要 CI 侧兜底构建（防漏 build），在此补 install + build 两步。
      - run: npm publish --provenance
        working-directory: packages/plugin
