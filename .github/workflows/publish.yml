name: Publish to npm

# 触发：按 tag 前缀分别发布两个包（单仓 pnpm workspaces 双包）。
#   skill-v*  → packages/skill（task-ledger，零构建步骤）
#   plugin-v* → packages/plugin（dsh-task-ledger，dist 已入仓，不重构建）
# 信任发布（OIDC）下无需 NPM_TOKEN；provenance 自动生成。
#
# 版本真源只有一个：**git tag**。CI 从 tag 解析版本号并写进 package.json
# （skill 另写 SKILL.md 头部那一行），不再依赖「打 tag 前记得改版本号」这种人肉对齐——
# tag 叫什么，npm 上就是什么。
# ⚠️ 每个包的 npm 侧 Trusted Publisher 均已按「GitHub Actions + 本仓 + publish.yml + Allow npm publish」配置。
on:
  push:
    tags:
      - 'skill-v*'
      - 'plugin-v*'

permissions:
  id-token: write   # 必需：供 npm 通过 OIDC 做信任发布
  contents: read

jobs:
  skill:
    if: startsWith(github.ref, 'refs/tags/skill-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'

      - run: node --version && npm --version

      # 版本号取自 tag：package.json 与 SKILL.md 头部两处都由这一行产出
      - name: 版本号取自 tag
        run: |
          ver="${GITHUB_REF_NAME#skill-v}"
          npm version "$ver" --no-git-tag-version --allow-same-version
          sed -i "s/^version: .*/version: $ver/" SKILL.md
          echo "发布版本：$ver"
        working-directory: packages/skill

      # npm 信任发布已勾选「Allow npm publish」：npm 11+ 自动走 OIDC，无需 NPM_TOKEN。
      - run: npm publish --provenance
        working-directory: packages/skill

  plugin:
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'

      - run: node --version && npm --version

      - name: 版本号取自 tag
        run: |
          ver="${GITHUB_REF_NAME#plugin-v}"
          npm version "$ver" --no-git-tag-version --allow-same-version
          echo "发布版本：$ver"
        working-directory: packages/plugin

      # dist 已入仓（DSH 生态规则：git 直装、装完即用）⇒ CI 直接发布仓库内产物，不重构建。
      # 若要 CI 侧兜底构建（防漏 build），在此补 install + build 两步。
      - run: npm publish --provenance
        working-directory: packages/plugin
