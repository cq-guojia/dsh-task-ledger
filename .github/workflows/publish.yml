name: Publish to npm

# 触发：推送形如 v* 的 tag 时，自动发布到 npm。
# 信任发布（OIDC）下无需 NPM_TOKEN；provenance 自动生成。
# ⚠️ npm 发的版本以 package.json 的 version 为准，不打 tag 本身——打 tag 前先改版本号，两者必须一致。
# 占位期：无依赖、无构建步骤；monorepo（pnpm workspaces 两包）落地后，
# 在 publish 前补 install + build（DSH 生态 dist 入仓、装完即用）。
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 必需：供 npm 通过 OIDC 做信任发布
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # 必须 npm 11.5.1+，否则无 OIDC 支持 → 404
          registry-url: 'https://registry.npmjs.org'

      - run: node --version && npm --version

      # npm 信任发布已勾选「Allow npm publish」：npm 11+ 自动走 OIDC，无需 NPM_TOKEN。
      - run: npm publish --provenance
