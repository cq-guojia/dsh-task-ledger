# pnpm 只认本文件（不读 package.json 的 workspaces 字段——2026-10-17 实测 pnpm 12.3.4）。
# 2026-10-17 修正：架构文档原记「workspaces 走 root package.json、不另建本文件」有误，以此为准。
packages:
  - "packages/*"
minimumReleaseAgeExclude:
  # 核心库跟 registry 最新（用户 2026-10-28）：pnpm 只认精确版本，每发新版把版本号加进这条并集
  - dsh-plugin-core@0.4.0 || 0.5.0 || 0.7.3 || 0.8.3
